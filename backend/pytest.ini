[pytest]
DJANGO_SETTINGS_MODULE = core.settings
python_files = test_*.py *_test.py
addopts = -v --tb=short --cov=tracker --cov=mcp_server --cov-report=term-missing
filterwarnings =
    ignore::DeprecationWarning

[coverage:run]
omit =
    *test*
    *__init__.py*
    *__main__.py*
    */tests/*
    */migrations/*
