name: Build and Push to GHCR

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup environment file
      run: cp .env.example .env

    - name: Run backend tests
      run: docker compose --profile test run --rm backend-test

    - name: Run frontend tests
      run: docker compose --profile test run --rm frontend-test

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build images
      run: |
        docker build -t ghcr.io/dtasev/davai-backend:${IMAGE_TAG} -t ghcr.io/dtasev/davai-backend:latest ./backend
        docker build -t ghcr.io/dtasev/davai-frontend:${IMAGE_TAG} -t ghcr.io/dtasev/davai-frontend:latest ./frontend
        docker build -t ghcr.io/dtasev/davai-nginx:${IMAGE_TAG} -t ghcr.io/dtasev/davai-nginx:latest ./nginx

    - name: Push images
      if: github.event_name != 'pull_request'
      run: |
        docker push ghcr.io/dtasev/davai-backend:${IMAGE_TAG}
        docker push ghcr.io/dtasev/davai-backend:latest
        docker push ghcr.io/dtasev/davai-frontend:${IMAGE_TAG}
        docker push ghcr.io/dtasev/davai-frontend:latest
        docker push ghcr.io/dtasev/davai-nginx:${IMAGE_TAG}
        docker push ghcr.io/dtasev/davai-nginx:latest
