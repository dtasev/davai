services:
  nginx:
    build: ./nginx
    ports:
      - "127.0.0.1:6477:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
      - authelia
    restart: unless-stopped

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-davai}
      - POSTGRES_USER=${POSTGRES_USER:-davai}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-davai_dev_secret_password_6477}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-davai} -d ${POSTGRES_DB:-davai}"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DEBUG=1
      - SECRET_KEY=django-insecure-dev-key-change-in-production-6477
      - ALLOWED_HOSTS=*
      - CORS_ALLOW_ALL_ORIGINS=True
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-davai}
      - POSTGRES_USER=${POSTGRES_USER:-davai}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-davai_dev_secret_password_6477}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-https://davai.dtasev.co.uk/authelia}
    restart: unless-stopped

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_HMR_PORT=6477
    restart: unless-stopped

  authelia:
    image: authelia/authelia:latest
    volumes:
      - ./authelia/config:/config
    environment:
      - TZ=UTC
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token eyJhIjoiYWM4YTI5YWZjYjk4N2ExYjQ4ZTc3YjgxZjUzYTY2OGUiLCJ0IjoiYzIxZDE3NDktZGM2My00NDg1LThlMTUtYTRkYzlkZmY1M2Q2IiwicyI6IllqWTFaR0k0TkdJdE1XUTNNeTAwT1dNeUxUazBaakF0Tm1SbVpqWTNNemt4TTJaaCJ9
    depends_on:
      - nginx

  opencode:
    profiles: ["opencode"]
    build: ./opencode
    depends_on:
      - backend
    volumes:
      - ./:/workspace
      - ./opencode/share:/root/.local/share/opencode
      - ./opencode/config/opencode.json:/root/.config/opencode/opencode.json
      - ./opencode/skills:/root/.config/opencode/skills
    environment:
      - OPENCODE_DATA_DIR=/workspace/opencode/data
      - DAVAI_API_KEY=${DAVAI_API_KEY}
    command:
      - opencode

  backend-test:
    build: ./backend
    profiles: ["test"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - test_backend_data:/app/data
    environment:
      - DEBUG=1
      - SECRET_KEY=django-insecure-test-key-davai
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-davai}
      - POSTGRES_USER=${POSTGRES_USER:-davai}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-davai_dev_secret_password_6477}
    command: ["pytest"]

  frontend-service:
    build: ./frontend
    profiles: ["test"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: ["npm", "run", "test"]

  frontend-test:
    build: ./frontend
    profiles: ["test"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: ["npm", "run", "test"]

volumes:
  backend_data:
  frontend_node_modules:
  test_backend_data:
  postgres_data:
