services:
  nginx:
    build: ./nginx
    ports:
      - "127.0.0.1:6477:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
      - authelia
    restart: unless-stopped

  backend:
    build: ./backend
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    environment:
      - DEBUG=1
      - SECRET_KEY=django-insecure-dev-key-change-in-production-6477
      - ALLOWED_HOSTS=*
      - CORS_ALLOW_ALL_ORIGINS=True
      - SQLITE_DB_PATH=/app/data/db.sqlite3
    restart: unless-stopped

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_HMR_PORT=6477
    restart: unless-stopped

  authelia:
    image: authelia/authelia:latest
    volumes:
      - ./authelia/config:/config
    environment:
      - TZ=UTC
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token eyJhIjoiYWM4YTI5YWZjYjk4N2ExYjQ4ZTc3YjgxZjUzYTY2OGUiLCJ0IjoiYzIxZDE3NDktZGM2My00NDg1LThlMTUtYTRkYzlkZmY1M2Q2IiwicyI6IllqWTFaR0k0TkdJdE1XUTNNeTAwT1dNeUxUazBaakF0Tm1SbVpqWTNNemt4TTJaaCJ9
    depends_on:
      - nginx

  backend-test:
    build: ./backend
    profiles: ["test"]
    volumes:
      - ./backend:/app
      - test_backend_data:/app/data
    environment:
      - DEBUG=1
      - SECRET_KEY=django-insecure-test-key-davai
      - SQLITE_DB_PATH=/app/data/test_db.sqlite3
    command: ["pytest"]

volumes:
  backend_data:
  frontend_node_modules:
  test_backend_data:
